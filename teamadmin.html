<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booba Team Admin Console — Quest Creator & Token Airdrop Hub</title>
  <meta name="description" content="Core team administrator console for the Booba (BNB baby) ecosystem to publish quests, manage user submissions, and distribute BOOBA tokens.">
  <link rel="icon" type="image/jpeg" href="assets/mascot.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- Master Stylesheet & Admin Stylesheet -->
  <link rel="stylesheet" href="src/styles/main.css?v=3.1">
  <link rel="stylesheet" href="teamadmin.css?v=3.1">
</head>
<body>

  <!-- MOBILE SIDEBAR BACKDROP -->
  <div class="admin-sidebar-backdrop" id="adminSidebarBackdrop"></div>

  <div class="admin-shell">
    
    <!-- ADMIN SIDEBAR NAVIGATION -->
    <aside class="admin-sidebar" id="adminSidebar" aria-label="Team Admin Navigation">
      <div class="admin-sidebar-header">
        <div style="display: flex; align-items: center; gap: 0.85rem; flex: 1;">
          <img src="assets/mascot.jpg" alt="Booba Mascot" class="admin-logo-img">
          <div>
            <div style="font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; color: #FFFFFF;">BOOBA ADMIN</div>
            <div style="font-size: 0.72rem; color: var(--brand-yellow); font-weight: 700;">BNB baby Core Studio</div>
          </div>
        </div>
        <button class="mobile-sidebar-close-btn" id="mobileSidebarCloseBtn" aria-label="Close sidebar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>

      <nav class="admin-nav">
        <a href="#overview" class="admin-nav-item active" data-tab="overview">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
          <span>Overview</span>
        </a>
        <a href="#quests" class="admin-nav-item" data-tab="quests">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          <span>Quests Studio</span>
        </a>
        <a href="#airdrop" class="admin-nav-item" data-tab="airdrop">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
          <span>Token & Airdrop</span>
        </a>
        <a href="#submissions" class="admin-nav-item" data-tab="submissions">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <span>Proof Submissions</span>
          <span class="admin-nav-badge" id="pendingSubmissionsBadge" style="display: none;">0</span>
        </a>
        <a href="#users" class="admin-nav-item" data-tab="users">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span>Citizens & Passports</span>
        </a>
      </nav>

      <div class="admin-sidebar-footer">
        <div class="admin-user-profile-card">
          <img src="assets/mascot.jpg" alt="Admin" class="admin-user-avatar">
          <div style="min-width: 0; flex: 1;">
            <div style="font-size: 0.85rem; font-weight: 700; color: #FFFFFF; display: flex; align-items: center; gap: 0.35rem;">
              <span>@BoobaBoss</span>
              <span class="live-pulse-dot" style="width: 5px; height: 5px;" title="Online"></span>
            </div>
            <div style="font-size: 0.7rem; color: var(--brand-yellow); font-weight: 600;">BNB Core Studio</div>
          </div>
        </div>
        <a href="index.html#home" class="btn-admin btn-admin-secondary btn-sm" style="width: 100%; text-align: center;">
          ← Main Website
        </a>
      </div>
    </aside>

    <!-- ADMIN MAIN WORKSPACE -->
    <div class="admin-main">
      
      <!-- Topbar Header -->
      <header class="admin-topbar">
        <div class="admin-topbar-left">
          <button class="mobile-admin-toggle" id="mobileAdminToggle" aria-label="Toggle Navigation Menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          
          <div class="admin-topbar-brand">
            <img src="assets/mascot.jpg" alt="Booba" class="admin-topbar-logo">
            <span class="admin-topbar-title">Booba Admin</span>
          </div>

          <span class="admin-badge-live">
            <span class="live-pulse-dot"></span>
            BNB Mainnet
          </span>
          <span class="admin-topbar-divider">|</span>
          <span class="admin-topbar-subtitle">Core Studio</span>
        </div>

        <div class="admin-topbar-right">
          <a href="dashboard.html" class="btn-admin btn-admin-secondary btn-sm admin-topbar-btn-desktop">
            User Dashboard ↗
          </a>
          <a href="quests.html" class="btn-admin btn-admin-primary btn-sm admin-topbar-btn-action">
            <span class="btn-text-full">Live App ↗</span>
            <span class="btn-text-short">App ↗</span>
          </a>
        </div>
      </header>

      <!-- Dynamic Content Injection Container -->
      <main class="admin-content-body" id="adminContentBody">
        <!-- Rendered by teamadmin.js -->
      </main>

    </div>

  </div>

  <!-- Toast Container -->
  <div class="admin-toast-container" id="adminToastContainer"></div>

  <!-- Motion & Physics Frameworks -->
  <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- Team Admin Script Module -->
  <script type="module" src="teamadmin.js?v=3.1"></script>
</body>
</html>
